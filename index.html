<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greet & Goodbye Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Welcome Section -->
        <div class="welcome">
            <h2>Welcome</h2>

            <div class="input-area">
                <input type="text" id="nameInput" placeholder="Your name">
                <button id="greetBtn">Greet</button>
            </div>
        </div>

        <!-- Hello and Goodbye Sections -->
        <div class="sections">

            <div class="card">
                <h2 id="helloTitle">Hello!</h2>
                <ul id="helloList"></ul>
            </div>

            <div class="card">
                <h2 id="goodbyeTitle">Goodbye!</h2>
                <ul id="goodbyeList"></ul>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
